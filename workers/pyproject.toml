[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "graphx-workers"
version = "0.1.0"
description = "GraphX source and document worker package"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "pydantic==2.12.5",
  "pydantic-settings==2.15.0",
]

[project.scripts]
graphx-source-worker = "graphx_workers.entrypoints.source_worker:main"
graphx-document-worker = "graphx_workers.entrypoints.document_worker:main"
graphx-browser-worker = "graphx_workers.entrypoints.browser_worker:main"

[dependency-groups]
dev = [
  "mypy==2.4.0",
  "pytest==9.1.1",
  "ruff==0.16.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/graphx_workers"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
