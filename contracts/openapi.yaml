openapi: 3.1.0
info:
  title: GraphX API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: >-
    Согласованное описание HTTP API GraphX. Наличие операции в этом файле не
    означает, что handler уже реализован. Назначение API и полный план ресурсов
    описаны в docs/08-api.md.
servers:
  - url: /api/v1
    description: Основной путь API
security: []
tags:
  - name: health
    description: Проверка процесса API и обязательных зависимостей
  - name: investigations
    description: Создание расследования и чтение его состояния
  - name: evidence
    description: Происхождение утверждений и доступ к сохранённым материалам
paths:
  /health/live:
    servers:
      - url: /
    get:
      operationId: getLiveness
      summary: Проверить, что процесс API запущен
      tags: [health]
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Процесс работает
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
  /health/ready:
    servers:
      - url: /
    get:
      operationId: getReadiness
      summary: Проверить готовность API принимать запросы
      tags: [health]
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Обязательные зависимости готовы
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          $ref: "#/components/responses/ProblemResponse"
  /investigations:
    post:
      operationId: createInvestigation
      summary: Создать расследование
      tags: [investigations]
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvestigationRequest"
      responses:
        "202":
          description: Расследование принято в работу
          headers:
            Location:
              description: Адрес созданного расследования
              schema:
                type: string
                format: uri-reference
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestigationAccepted"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
  /investigations/{investigation_id}:
    get:
      operationId: getInvestigation
      summary: Получить расследование
      tags: [investigations]
      parameters:
        - $ref: "#/components/parameters/InvestigationID"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Текущее состояние расследования
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /investigations/{investigation_id}/status:
    get:
      operationId: getInvestigationStatus
      summary: Получить ход расследования и состояния источников
      tags: [investigations]
      parameters:
        - $ref: "#/components/parameters/InvestigationID"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Состояние расследования
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestigationStatus"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /investigations/{investigation_id}/cancel:
    post:
      operationId: cancelInvestigation
      summary: Отменить расследование
      tags: [investigations]
      parameters:
        - $ref: "#/components/parameters/InvestigationID"
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Расследование отменено
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
        "404":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
  /claims/{claim_id}/evidence:
    get:
      operationId: getClaimEvidence
      summary: Получить происхождение утверждения
      tags: [evidence]
      parameters:
        - $ref: "#/components/parameters/ClaimID"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Утверждение и ссылка на исходный материал
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimEvidence"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /artifacts/{artifact_id}/content:
    get:
      operationId: getArtifactContent
      summary: Открыть сохранённый исходный материал
      description: >-
        Возвращает неизменяемое содержимое artifact через Go API. Object key MinIO
        наружу не передаётся. Content-Type ответа соответствует сохранённому
        media type.
      tags: [evidence]
      parameters:
        - $ref: "#/components/parameters/ArtifactID"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Содержимое исходного материала
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            ETag:
              description: SHA-256 неизменяемого объекта
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/ProblemResponse"
components:
  headers:
    RequestID:
      description: Диагностический идентификатор HTTP-запроса
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: >-
        Диагностический идентификатор клиента. Если значение отсутствует или не
        проходит безопасную проверку, API создаёт новый идентификатор и возвращает
        его в одноимённом заголовке ответа.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
    InvestigationID:
      name: investigation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClaimID:
      name: claim_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactID:
      name: artifact_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID одной пользовательской команды
      schema:
        type: string
        format: uuid
  responses:
    ProblemResponse:
      description: Ошибка выполнения запроса
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Liveness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          additionalProperties:
            type: string
    SubjectInput:
      type: object
      additionalProperties: false
      required: [type, name]
      properties:
        type:
          type: string
          enum: [person, organization]
        name:
          type: string
          minLength: 1
          maxLength: 500
        identifiers:
          type: object
          additionalProperties:
            type: string
    InvestigationLimits:
      type: object
      additionalProperties: false
      properties:
        depth:
          type: integer
          minimum: 0
          maximum: 2
          default: 1
        entity_limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        sources:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
    CreateInvestigationRequest:
      type: object
      additionalProperties: false
      required: [subject]
      properties:
        subject:
          $ref: "#/components/schemas/SubjectInput"
        limits:
          $ref: "#/components/schemas/InvestigationLimits"
    InvestigationAccepted:
      type: object
      additionalProperties: false
      required: [id, status, stage, status_url]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          const: running
        stage:
          type: string
          const: subject_discovery
        status_url:
          type: string
          format: uri-reference
    Investigation:
      type: object
      additionalProperties: false
      required:
        [id, subject, status, stage, state_version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        subject:
          $ref: "#/components/schemas/SubjectInput"
        status:
          $ref: "#/components/schemas/InvestigationState"
        stage:
          $ref: "#/components/schemas/InvestigationStage"
        state_version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    InvestigationStatus:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - stage
        - state_version
        - progress
        - sources
        - requires_action
        - pending_review_count
        - reviews_url
        - source_actions
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/InvestigationState"
        stage:
          $ref: "#/components/schemas/InvestigationStage"
        state_version:
          type: integer
          minimum: 1
        progress:
          type: object
          additionalProperties: false
          required: [terminal_jobs, known_jobs]
          properties:
            terminal_jobs:
              type: integer
              minimum: 0
              description: Число заданий, достигших конечного состояния
            known_jobs:
              type: integer
              minimum: 0
              description: >-
                Число созданных к этому моменту заданий. Оно может увеличиваться
                при переходе к enrichment и не используется как точный процент.
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceStatus"
        requires_action:
          type: boolean
          description: Есть открытый review или действие по источнику
        pending_review_count:
          type: integer
          minimum: 0
        reviews_url:
          type: [string, "null"]
          format: uri-reference
          description: Список reviews расследования; null, если открытых reviews нет
        source_actions:
          type: array
          items:
            $ref: "#/components/schemas/SourceAction"
        updated_at:
          type: string
          format: date-time
    SourceStatus:
      type: object
      additionalProperties: false
      required:
        - source_code
        - status
        - active_job_count
        - terminal_job_count
        - known_job_count
        - attempt_count
        - error_code
        - error_detail
        - next_attempt_at
        - updated_at
      properties:
        source_code:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/SourceAggregateState"
        active_job_count:
          type: integer
          minimum: 0
        terminal_job_count:
          type: integer
          minimum: 0
        known_job_count:
          type: integer
          minimum: 0
        attempt_count:
          type: integer
          minimum: 0
          description: Общее число начатых попыток по заданиям этого источника
        error_code:
          type: [string, "null"]
        error_detail:
          type: [string, "null"]
          description: Безопасное для пользователя описание последней существенной ошибки
        next_attempt_at:
          type: [string, "null"]
          format: date-time
        updated_at:
          type: string
          format: date-time
    SourceAction:
      type: object
      additionalProperties: false
      required: [job_id, source_code, action_code, detail, action_url]
      properties:
        job_id:
          type: string
          format: uuid
        source_code:
          type: string
          minLength: 1
        action_code:
          type: string
          minLength: 1
          description: Машиночитаемый код требуемого действия
        detail:
          type: string
          minLength: 1
          description: Безопасное и понятное описание действия
        action_url:
          type: [string, "null"]
          format: uri-reference
    InvestigationState:
      type: string
      enum: [created, running, completed, completed_partial, failed, cancelled]
    InvestigationStage:
      type: string
      enum:
        [subject_discovery, subject_resolution, enrichment, analysis, completed]
    SourceAggregateState:
      type: string
      description: >-
        Сводное состояние всех заданий источника в расследовании. Это не состояние
        отдельной строки source_jobs.
      enum:
        [
          pending,
          running,
          retry_wait,
          action_required,
          succeeded,
          not_found,
          completed_partial,
          unavailable,
          failed,
          cancelled,
        ]
    ClaimEvidence:
      type: object
      additionalProperties: false
      required:
        [
          claim,
          source_record,
          processing,
          artifact,
          evidence_locator,
          evidence_excerpt,
        ]
      properties:
        claim:
          $ref: "#/components/schemas/ClaimDetails"
        source_record:
          $ref: "#/components/schemas/SourceRecordDetails"
        processing:
          $ref: "#/components/schemas/ProcessingDetails"
        artifact:
          $ref: "#/components/schemas/ArtifactDetails"
        evidence_locator:
          type: object
          minProperties: 1
        evidence_excerpt:
          type: [string, "null"]
    ClaimDetails:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - subject_ref
        - object_ref
        - predicate
        - value
        - raw_value
        - normalized_value
        - qualifiers
        - valid_from
        - valid_to
        - valid_from_precision
        - valid_to_precision
        - temporal_basis
        - snapshot_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [attribute, relationship, event]
        subject_ref:
          type: string
          minLength: 1
          description: Локальная ссылка исходной записи на субъект утверждения
        object_ref:
          type: [string, "null"]
          description: Локальная ссылка на объект relationship claim
        predicate:
          type: string
          minLength: 1
        value:
          description: Типизированное значение утверждения или null для relationship claim
        raw_value:
          description: Исходное значение без нормализации
        normalized_value:
          description: Нормализованное значение, если оно построено
        qualifiers:
          type: object
        valid_from:
          type: [string, "null"]
          format: date
          description: Каноническая дата-якорь; точность задаётся отдельным полем
        valid_to:
          type: [string, "null"]
          format: date
          description: Исключающая верхняя граница или её каноническая дата-якорь
        valid_from_precision:
          $ref: "#/components/schemas/DatePrecision"
        valid_to_precision:
          $ref: "#/components/schemas/DatePrecision"
        temporal_basis:
          $ref: "#/components/schemas/TemporalBasis"
        snapshot_at:
          type: [string, "null"]
          format: date-time
    SourceRecordDetails:
      type: object
      additionalProperties: false
      required: [id, source_code, record_type, external_id]
      properties:
        id:
          type: string
          format: uuid
        source_code:
          type: string
          minLength: 1
        record_type:
          type: string
          minLength: 1
        external_id:
          type: [string, "null"]
    ProcessingDetails:
      type: object
      additionalProperties: false
      required:
        [
          id,
          schema_version,
          adapter_version,
          parser_version,
          mapping_version,
          normalization_version,
        ]
      properties:
        id:
          type: string
          format: uuid
        schema_version:
          type: string
        adapter_version:
          type: string
        parser_version:
          type: string
        mapping_version:
          type: string
        normalization_version:
          type: string
    ArtifactDetails:
      type: object
      additionalProperties: false
      required:
        [
          id,
          kind,
          media_type,
          sha256,
          byte_size,
          source_uri,
          published_at,
          retrieved_at,
          content_url,
        ]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        media_type:
          type: string
        sha256:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"
        byte_size:
          type: integer
          minimum: 0
        source_uri:
          type: string
        published_at:
          type: [string, "null"]
          format: date-time
        retrieved_at:
          type: string
          format: date-time
        content_url:
          type: string
          format: uri-reference
    DatePrecision:
      type: string
      enum: [day, month, year, approximate, unknown]
    TemporalBasis:
      type: string
      enum: [explicit, event_derived, snapshot, computed, unknown]
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, detail]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          minLength: 1
