    TemporalSpan:
      type: object
      additionalProperties: false
      description: >-
        Переносимая форма временной семантики. Сгенерированные Go и
        TypeScript типы отражают поля, но не заменяют runtime/domain validation:
        приложение проверяет согласованность precision, date anchors, snapshot и
        допустимый порядок границ.
      required:
        [
          valid_from,
          valid_to,
          valid_from_precision,
          valid_to_precision,
          temporal_basis,
          snapshot_at,
        ]
      properties:
        valid_from:
          type: [string, "null"]
          format: date
        valid_to:
          type: [string, "null"]
          format: date
        valid_from_precision:
          $ref: "#/components/schemas/DatePrecision"
        valid_to_precision:
          $ref: "#/components/schemas/DatePrecision"
        temporal_basis:
          $ref: "#/components/schemas/TemporalBasis"
        snapshot_at:
          type: [string, "null"]
          format: date-time
      allOf:
        - if:
            properties:
              valid_from_precision:
                const: unknown
          then:
            properties:
              valid_from:
                type: "null"
          else:
            properties:
              valid_from:
                type: string
                format: date
        - if:
            properties:
              valid_to_precision:
                const: unknown
          then:
            properties:
              valid_to:
                type: "null"
          else:
            properties:
              valid_to:
                type: string
                format: date
        - if:
            properties:
              temporal_basis:
                const: snapshot
          then:
            properties:
              valid_from:
                type: "null"
              valid_to:
                type: "null"
              valid_from_precision:
                const: unknown
              valid_to_precision:
                const: unknown
              snapshot_at:
                type: string
                format: date-time
          else:
            properties:
              snapshot_at:
                type: "null"
        - if:
            properties:
              temporal_basis:
                const: unknown
          then:
            properties:
              valid_from:
                type: "null"
              valid_to:
                type: "null"
              snapshot_at:
                type: "null"
