openapi: 3.1.0
info:
  title: GraphX API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: >-
    Согласованное описание HTTP API GraphX. Наличие операции в этом файле не
    означает, что handler уже реализован. Назначение API и полный план ресурсов
    описаны в docs/08-api.md.
servers:
  - url: /api/v1
    description: Основной путь API
security: []
paths:
  /health/live:
    servers:
      - url: /
    get:
      operationId: getLiveness
      summary: Проверить, что процесс API запущен
      tags: [health]
      responses:
        "200":
          description: Процесс работает
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
  /health/ready:
    servers:
      - url: /
    get:
      operationId: getReadiness
      summary: Проверить готовность API принимать запросы
      tags: [health]
      responses:
        "200":
          description: Обязательные зависимости готовы
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          $ref: "#/components/responses/ProblemResponse"
  /investigations:
    post:
      operationId: createInvestigation
      summary: Создать расследование
      tags: [investigations]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvestigationRequest"
      responses:
        "202":
          description: Расследование принято в работу
          headers:
            Location:
              description: Адрес созданного расследования
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestigationAccepted"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
  /investigations/{investigation_id}:
    get:
      operationId: getInvestigation
      summary: Получить расследование
      tags: [investigations]
      parameters:
        - $ref: "#/components/parameters/InvestigationID"
      responses:
        "200":
          description: Текущее состояние расследования
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /investigations/{investigation_id}/status:
    get:
      operationId: getInvestigationStatus
      summary: Получить ход расследования и состояния источников
      tags: [investigations]
      parameters:
        - $ref: "#/components/parameters/InvestigationID"
      responses:
        "200":
          description: Состояние расследования
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestigationStatus"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /investigations/{investigation_id}/cancel:
    post:
      operationId: cancelInvestigation
      summary: Отменить расследование
      tags: [investigations]
      parameters:
        - $ref: "#/components/parameters/InvestigationID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Расследование отменено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
        "404":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
  /claims/{claim_id}/evidence:
    get:
      operationId: getClaimEvidence
      summary: Получить происхождение утверждения
      tags: [evidence]
      parameters:
        - $ref: "#/components/parameters/ClaimID"
      responses:
        "200":
          description: Утверждение и ссылка на исходный материал
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimEvidence"
        "404":
          $ref: "#/components/responses/ProblemResponse"
components:
  headers:
    RequestID:
      description: Диагностический идентификатор HTTP-запроса
      schema:
        type: string
  parameters:
    InvestigationID:
      name: investigation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClaimID:
      name: claim_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID одной пользовательской команды
      schema:
        type: string
        format: uuid
  responses:
    ProblemResponse:
      description: Ошибка выполнения запроса
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Liveness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          enum: [ready, not_ready]
        checks:
          type: object
          additionalProperties:
            type: string
    SubjectInput:
      type: object
      additionalProperties: false
      required: [type, name]
      properties:
        type:
          enum: [person, organization]
        name:
          type: string
          minLength: 1
          maxLength: 500
        identifiers:
          type: object
          additionalProperties:
            type: string
    InvestigationLimits:
      type: object
      additionalProperties: false
      properties:
        depth:
          type: integer
          minimum: 0
          maximum: 2
          default: 1
        entity_limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        sources:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
    CreateInvestigationRequest:
      type: object
      additionalProperties: false
      required: [subject]
      properties:
        subject:
          $ref: "#/components/schemas/SubjectInput"
        limits:
          $ref: "#/components/schemas/InvestigationLimits"
    InvestigationAccepted:
      type: object
      additionalProperties: false
      required: [id, status, stage, status_url]
      properties:
        id:
          type: string
          format: uuid
        status:
          const: running
        stage:
          const: subject_discovery
        status_url:
          type: string
          format: uri-reference
    Investigation:
      type: object
      additionalProperties: false
      required: [id, subject, status, stage, state_version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        subject:
          $ref: "#/components/schemas/SubjectInput"
        status:
          $ref: "#/components/schemas/InvestigationState"
        stage:
          $ref: "#/components/schemas/InvestigationStage"
        state_version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    InvestigationStatus:
      type: object
      additionalProperties: false
      required: [id, status, stage, state_version, progress, sources, requires_action, updated_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/InvestigationState"
        stage:
          $ref: "#/components/schemas/InvestigationStage"
        state_version:
          type: integer
          minimum: 1
        progress:
          type: object
          additionalProperties: false
          required: [completed_jobs, total_jobs]
          properties:
            completed_jobs:
              type: integer
              minimum: 0
            total_jobs:
              type: integer
              minimum: 0
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceStatus"
        requires_action:
          type: boolean
        action_url:
          type: [string, "null"]
          format: uri-reference
        updated_at:
          type: string
          format: date-time
    SourceStatus:
      type: object
      additionalProperties: false
      required: [source, status, attempt_no, updated_at]
      properties:
        source:
          type: string
        status:
          $ref: "#/components/schemas/SourceJobState"
        attempt_no:
          type: integer
          minimum: 0
        error_code:
          type: [string, "null"]
        updated_at:
          type: string
          format: date-time
    InvestigationState:
      enum: [created, running, completed, completed_partial, failed, cancelled]
    InvestigationStage:
      enum: [subject_discovery, subject_resolution, enrichment, analysis, completed]
    SourceJobState:
      enum: [pending, queued, running, retry_wait, succeeded, not_found, action_required, unavailable, failed, cancelled]
    ClaimEvidence:
      type: object
      additionalProperties: false
      required: [claim_id, predicate, source_record_id, artifact, evidence_locator]
      properties:
        claim_id:
          type: string
          format: uuid
        predicate:
          type: string
        value: true
        source_record_id:
          type: string
          format: uuid
        artifact:
          type: object
          additionalProperties: false
          required: [id, media_type, sha256, retrieved_at]
          properties:
            id:
              type: string
              format: uuid
            media_type:
              type: string
            sha256:
              type: string
              pattern: "^[a-fA-F0-9]{64}$"
            retrieved_at:
              type: string
              format: date-time
        evidence_locator:
          type: object
          minProperties: 1
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
