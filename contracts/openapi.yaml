openapi: 3.1.0
info:
  title: GraphX API
  version: 0.2.0
  license:
    name: MIT
    identifier: MIT
  description: >-
    Согласованное описание HTTP API GraphX. Наличие операции в этом файле не
    означает, что handler уже реализован. Назначение API и полный план ресурсов
    описаны в docs/08-api.md.
servers:
  - url: /api/v1
    description: Основной путь API
security: []
tags:
  - name: health
    description: Проверка процесса API и обязательных зависимостей
  - name: investigations
    description: Создание расследования и чтение его состояния
  - name: sources
    description: Доступные источники и их возможности
  - name: reviews
    description: Проверка неоднозначных совпадений
  - name: entities
    description: Канонические сущности и расширение исследования
  - name: knowledge
    description: Граф, временная шкала и фактические связи
  - name: evidence
    description: Происхождение утверждений и доступ к сохранённым материалам
paths:
  /health/live:
    servers:
      - url: /
    get:
      operationId: getLiveness
      summary: Проверить, что процесс API запущен
      tags: [health]
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Процесс работает
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
  /health/ready:
    servers:
      - url: /
    get:
      operationId: getReadiness
      summary: Проверить готовность API принимать запросы
      tags: [health]
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Обязательные зависимости готовы
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          $ref: "#/components/responses/ProblemResponse"
  /investigations:
    post:
      operationId: createInvestigation
      summary: Создать расследование
      tags: [investigations]
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvestigationRequest"
      responses:
        "202":
          description: Расследование принято в работу
          headers:
            Location:
              description: Адрес созданного расследования
              schema:
                type: string
                format: uri-reference
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestigationAccepted"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
  /investigations/{investigation_id}:
    get:
      operationId: getInvestigation
      summary: Получить расследование
      tags: [investigations]
      parameters:
        - $ref: "#/components/parameters/InvestigationID"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Текущее состояние расследования
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /investigations/{investigation_id}/status:
    get:
      operationId: getInvestigationStatus
      summary: Получить ход расследования и состояния источников
      tags: [investigations]
      parameters:
        - $ref: "#/components/parameters/InvestigationID"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Состояние расследования
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestigationStatus"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /investigations/{investigation_id}/cancel:
    post:
      operationId: cancelInvestigation
      summary: Отменить расследование
      tags: [investigations]
      parameters:
        - $ref: "#/components/parameters/InvestigationID"
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Расследование отменено
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
        "404":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
  /sources:
    get:
      operationId: listSources
      summary: Получить доступные источники
      tags: [sources]
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Каталог источников, доступных для новых расследований
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceCatalog"
        "500":
          $ref: "#/components/responses/ProblemResponse"
  /investigations/{investigation_id}/reviews:
    get:
      operationId: listInvestigationReviews
      summary: Получить проверки совпадений расследования
      tags: [reviews]
      parameters:
        - $ref: "#/components/parameters/InvestigationID"
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageLimit"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ReviewState"
      responses:
        "200":
          description: Страница проверок совпадений
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPage"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /reviews/{review_id}:
    get:
      operationId: getReview
      summary: Получить проверку и кандидатов
      tags: [reviews]
      parameters:
        - $ref: "#/components/parameters/ReviewID"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Проверка исходной записи и возможных совпадений
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchReview"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /reviews/{review_id}/decision:
    post:
      operationId: decideReview
      summary: Принять решение о совпадении
      tags: [reviews]
      parameters:
        - $ref: "#/components/parameters/ReviewID"
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecisionRequest"
      responses:
        "200":
          description: Решение сохранено
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDecisionResult"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
  /reviews/{review_id}/decision/revert:
    post:
      operationId: revertReviewDecision
      summary: Отменить последнее решение о совпадении
      tags: [reviews]
      parameters:
        - $ref: "#/components/parameters/ReviewID"
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevertReviewDecisionRequest"
      responses:
        "200":
          description: Решение отменено, review снова требует проверки
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchReview"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
  /investigations/{investigation_id}/entities:
    get:
      operationId: listInvestigationEntities
      summary: Получить сущности расследования
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/InvestigationID"
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Страница сущностей расследования
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestigationEntityPage"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /entities/{entity_id}:
    get:
      operationId: getEntity
      summary: Получить карточку сущности
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityID"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Каноническая сущность и её подтверждённые данные
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityDetails"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /entities/{entity_id}/expand:
    post:
      operationId: expandEntity
      summary: Запросить расширение ветви от сущности
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityID"
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpandEntityRequest"
      responses:
        "202":
          description: Расширение принято в работу
          headers:
            Location:
              description: Адрес статуса расследования
              schema:
                type: string
                format: uri-reference
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpansionAccepted"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
  /investigations/{investigation_id}/graph:
    get:
      operationId: getInvestigationGraph
      summary: Получить компактный граф расследования
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/InvestigationID"
        - $ref: "#/components/parameters/RequestID"
        - name: include_derived
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: include_hypotheses
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Ограниченная проекция графа для интерфейса
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestigationGraph"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /investigations/{investigation_id}/timeline:
    get:
      operationId: getInvestigationTimeline
      summary: Получить временную шкалу расследования
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/InvestigationID"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: События, снимки и интервалы без повышения точности дат
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestigationTimeline"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /relationships/{relationship_id}:
    get:
      operationId: getRelationship
      summary: Получить фактическую связь и её доказательства
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/RelationshipID"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Каноническая фактическая связь
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipDetails"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /claims/{claim_id}/evidence:
    get:
      operationId: getClaimEvidence
      summary: Получить происхождение утверждения
      tags: [evidence]
      parameters:
        - $ref: "#/components/parameters/ClaimID"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Утверждение и ссылка на исходный материал
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimEvidence"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /artifacts/{artifact_id}/content:
    get:
      operationId: getArtifactContent
      summary: Открыть сохранённый исходный материал
      description: >-
        Возвращает неизменяемое содержимое artifact через Go API. Object key MinIO
        наружу не передаётся. Content-Type ответа соответствует сохранённому
        media type.
      tags: [evidence]
      parameters:
        - $ref: "#/components/parameters/ArtifactID"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Содержимое исходного материала
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            ETag:
              description: Strong ETag с SHA-256 неизменяемого объекта
              schema:
                type: string
                pattern: '^"[a-f0-9]{64}"$'
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/ProblemResponse"
components:
  headers:
    RequestID:
      description: Диагностический идентификатор HTTP-запроса
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: >-
        Диагностический идентификатор клиента. Если значение отсутствует или не
        проходит безопасную проверку, API создаёт новый идентификатор и возвращает
        его в одноимённом заголовке ответа.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
    InvestigationID:
      name: investigation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClaimID:
      name: claim_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactID:
      name: artifact_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReviewID:
      name: review_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EntityID:
      name: entity_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RelationshipID:
      name: relationship_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: Непрозрачный указатель на следующую страницу
      schema:
        type: string
        minLength: 1
        maxLength: 512
    PageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID одной пользовательской команды
      schema:
        type: string
        format: uuid
  responses:
    ProblemResponse:
      description: Ошибка выполнения запроса
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Liveness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          additionalProperties:
            type: string
    SubjectInput:
      oneOf:
        - $ref: "#/components/schemas/NamedSubjectInput"
        - $ref: "#/components/schemas/IdentifiedSubjectInput"
      description: >-
        Исходный субъект задаётся именем, идентификаторами либо обоими способами.
        Две явные формы сохраняют это правило в сгенерированных TypeScript-типах:
        объект с name может дополнительно содержать identifiers, а объект без name
        обязан содержать identifiers.
    NamedSubjectInput:
      type: object
      additionalProperties: false
      required: [type, name]
      properties:
        type:
          type: string
          enum: [person, organization]
        name:
          type: string
          minLength: 1
          maxLength: 500
        identifiers:
          type: object
          minProperties: 1
          propertyNames:
            minLength: 1
          additionalProperties:
            type: string
            minLength: 1
    IdentifiedSubjectInput:
      type: object
      additionalProperties: false
      required: [type, identifiers]
      properties:
        type:
          type: string
          enum: [person, organization]
        identifiers:
          type: object
          minProperties: 1
          propertyNames:
            minLength: 1
          additionalProperties:
            type: string
            minLength: 1
    InvestigationLimits:
      type: object
      additionalProperties: false
      properties:
        depth:
          type: integer
          minimum: 0
          maximum: 2
          description: Если поле отсутствует, API применяет значение 1.
        entity_limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Если поле отсутствует, API применяет значение 50.
        sources:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
    CreateInvestigationRequest:
      type: object
      additionalProperties: false
      required: [subject]
      properties:
        subject:
          $ref: "#/components/schemas/SubjectInput"
        limits:
          $ref: "#/components/schemas/InvestigationLimits"
    InvestigationAccepted:
      type: object
      additionalProperties: false
      required: [id, status, stage, status_url]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          const: running
        stage:
          type: string
          const: subject_discovery
        status_url:
          type: string
          format: uri-reference
    Investigation:
      type: object
      additionalProperties: false
      required:
        [id, subject, status, stage, state_version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        subject:
          $ref: "#/components/schemas/SubjectInput"
        status:
          $ref: "#/components/schemas/InvestigationState"
        stage:
          $ref: "#/components/schemas/InvestigationStage"
        state_version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    InvestigationStatus:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - stage
        - state_version
        - progress
        - sources
        - requires_action
        - pending_review_count
        - reviews_url
        - source_actions
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/InvestigationState"
        stage:
          $ref: "#/components/schemas/InvestigationStage"
        state_version:
          type: integer
          minimum: 1
        progress:
          type: object
          additionalProperties: false
          required: [terminal_jobs, known_jobs]
          properties:
            terminal_jobs:
              type: integer
              minimum: 0
              description: Число заданий, достигших конечного состояния
            known_jobs:
              type: integer
              minimum: 0
              description: >-
                Число созданных к этому моменту заданий. Оно может увеличиваться
                при переходе к enrichment и не используется как точный процент.
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceStatus"
        requires_action:
          type: boolean
          description: Есть открытый review или действие по источнику
        pending_review_count:
          type: integer
          minimum: 0
        reviews_url:
          type: [string, "null"]
          format: uri-reference
          description: Список reviews расследования; null, если открытых reviews нет
        source_actions:
          type: array
          items:
            $ref: "#/components/schemas/SourceAction"
        updated_at:
          type: string
          format: date-time
    SourceStatus:
      type: object
      additionalProperties: false
      required:
        - source_code
        - status
        - active_job_count
        - terminal_job_count
        - known_job_count
        - attempt_count
        - error_code
        - error_detail
        - next_attempt_at
        - updated_at
      properties:
        source_code:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/SourceAggregateState"
        active_job_count:
          type: integer
          minimum: 0
        terminal_job_count:
          type: integer
          minimum: 0
        known_job_count:
          type: integer
          minimum: 0
        attempt_count:
          type: integer
          minimum: 0
          description: Общее число начатых попыток по заданиям этого источника
        error_code:
          type: [string, "null"]
        error_detail:
          type: [string, "null"]
          description: Безопасное для пользователя описание последней существенной ошибки
        next_attempt_at:
          type: [string, "null"]
          format: date-time
        updated_at:
          type: string
          format: date-time
    SourceAction:
      type: object
      additionalProperties: false
      required: [job_id, source_code, action_code, detail, action_url]
      properties:
        job_id:
